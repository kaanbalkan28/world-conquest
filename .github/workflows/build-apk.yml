name: Build APK (yatay ekran kilitli)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Bayraklari ac
        run: unzip -q -o flags.zip -d www && ls www/flags | wc -l
      - run: npm install
      - run: npx cap add android
      - name: Yatay ekran kilidi
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation $F || sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $F
          grep -n screenOrientation $F
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: world-conquest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
